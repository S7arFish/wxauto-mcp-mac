[project]
name = "wxauto-mcp-macos"
version = "0.1.0"
description = "macOS 版微信自动化 MCP Server，基于 AppleScript + Accessibility API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
]

[project.scripts]
wxauto-mcp-macos = "wxauto_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wxauto_mcp" = ["scripts/*.scpt"]
